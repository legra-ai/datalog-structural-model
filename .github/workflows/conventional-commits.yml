name: Conventional Commits
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  pull-requests: read
jobs:
  title:
    name: Conventional Commit
    runs-on: ubuntu-latest
    steps:
      # Trusted metadata-only action: never check out or execute PR code here.
      - uses: legra-ai/github-actions/.github/actions/conventional-commit@e1594cd9f3a39586ab3f6f339801b6c7a3a0cf92
